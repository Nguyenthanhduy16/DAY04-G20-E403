tools:
  - name: clarify
    description: "Ask the user for missing required information or for confirmation before a sensitive action. Use this when an account/handle, URL, or yes/no approval is missing. For any send/post/publish/Telegram request, use response_type=yes_no before calling send, even when the content is vague or missing."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Short question to ask the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected response type. Use yes_no for confirmations."}
        options: {type: array, default: [], items: {type: string}, description: "Options when response_type is choice."}
      required: [question]

  - name: timeline
    description: "Get recent tweets/posts from one specific account. Use only when the user names a specific person/account. screenname must be the handle without @, for example Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy. Do not use when the account is missing; call clarify instead."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @."}
        limit: {type: integer, default: 5, description: "Number of posts to return. Preserve the user requested number."}
      required: [screenname]

  - name: social_search
    description: "Search Twitter/X/social posts by topic or keyword. Use when the user asks what people are saying about a topic, not when they ask for one account's posts. Use search_type=Top for top/popular posts; otherwise use Latest."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest for recent posts; Top for popular/top posts."}
        limit: {type: integer, default: 5, description: "Number of posts to return."}
      required: [query]

  - name: lookup
    description: "Search the web for information or news. Use for current events, web research, and news requests. For news/current-event requests set topic=news. Map today/hom nay to timeframe=day; this week/tuan nay to week; this month to month; this year to year. Do not use when the user provides a specific URL; use fetch instead."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Web search query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use news for current news; general for evergreen research."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time range for news/current requests."}
        max_results: {type: integer, default: 5, description: "Number of web results."}
      required: [query]

  - name: fetch
    description: "Read the content of one specific URL supplied by the user. Use for summarize/read this link/article requests when the URL is present. If no URL is present, call clarify instead of guessing a URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact URL supplied by the user."}
      required: [url]

  - name: format
    description: "Format already available items into a markdown digest, bullets, sections, thread, or daily AI Vietnamese digest. Use after search/fetch results are available, not as the first step when information still needs to be gathered."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items returned by other tools."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template."}
        headline: {type: string, default: "", description: "Optional headline."}
      required: [items, template]

  - name: source_check
    description: "Check whether a URL, domain, or source is suitable to cite before using it in a research answer. Use when the user asks to check source reliability, citation suitability, domain trust, or whether a link should be cited. Do not use to read article contents; use fetch for summarizing a URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL or domain to check."}
      required: [url]
  - name: send
    description: "Send text to Telegram or another external destination. This is a sensitive write action. Use only after the user has explicitly confirmed yes in the conversation. Never use for ordinary answers, math, coding, or out-of-scope requests. If not confirmed, call clarify with response_type=yes_no instead."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to send after confirmation."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit user confirmation."}
      required: [text]

  - name: policy
    description: "Search internal company policy markdown. Use only when the user asks about internal/company rules, policy, privacy, citations, publishing, research, or tool usage."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy search query."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area filter."}
        top_k: {type: integer, default: 3, description: "Number of policy matches."}
      required: [query]

  - name: papers
    description: "Search arXiv papers. Use for academic paper or research literature search requests, not for general web news."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order."}
      required: [query]

  - name: paper_text
    description: "Extract text from a specific arXiv paper ID or arXiv URL. Use only when the user provides or clearly refers to a specific arXiv paper."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL."}
        max_pages: {type: integer, default: 5, description: "Maximum pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum characters to return."}
      required: [arxiv_url]
